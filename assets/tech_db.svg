<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 70" width="100%" height="70" style="overflow: visible;">
  <defs>
    <linearGradient id="bgDb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glowDb" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#3b82f6" flood-opacity="0.3"/>
    </filter>
  </defs>
  <style>
    .t-main { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 12px; fill: #ffffff; }
    .b1 { animation: floatY 3.4s ease-in-out infinite alternate; }
    .b2 { animation: floatY 4.0s ease-in-out infinite alternate 0.5s; }
    .b3 { animation: floatY 3.6s ease-in-out infinite alternate 1.1s; }
    .b4 { animation: floatY 4.2s ease-in-out infinite alternate 1.6s; }
    @keyframes floatY { 0% { transform: translateY(0px); } 100% { transform: translateY(-5px); } }
  </style>

  <g transform="translate(0, 10)">
    <!-- PostgreSQL -->
    <g class="b1" transform="translate(0, 0)" filter="url(#glowDb)">
      <rect width="125" height="40" rx="10" fill="url(#bgDb)" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="18" y="25" font-size="14">🐘</text>
      <text x="36" y="25" class="t-main">PostgreSQL</text>
    </g>
    <!-- MongoDB -->
    <g class="b2" transform="translate(135, 0)" filter="url(#glowDb)">
      <rect width="115" height="40" rx="10" fill="url(#bgDb)" stroke="#10b981" stroke-width="1.5"/>
      <text x="18" y="25" font-size="14">🍃</text>
      <text x="36" y="25" class="t-main">MongoDB</text>
    </g>
    <!-- Redis -->
    <g class="b3" transform="translate(260, 0)" filter="url(#glowDb)">
      <rect width="90" height="40" rx="10" fill="url(#bgDb)" stroke="#ef4444" stroke-width="1.5"/>
      <text x="16" y="25" font-size="14">⚡</text>
      <text x="34" y="25" class="t-main">Redis</text>
    </g>
    <!-- Supabase -->
    <g class="b4" transform="translate(360, 0)" filter="url(#glowDb)">
      <rect width="115" height="40" rx="10" fill="url(#bgDb)" stroke="#10b981" stroke-width="1.5"/>
      <text x="18" y="25" font-size="14">⚡</text>
      <text x="36" y="25" class="t-main">Supabase</text>
    </g>
    <!-- Neon PG -->
    <g class="b1" transform="translate(485, 0)" filter="url(#glowDb)">
      <rect width="105" height="40" rx="10" fill="url(#bgDb)" stroke="#00e599" stroke-width="1.5"/>
      <text x="18" y="25" font-size="14">🟢</text>
      <text x="36" y="25" class="t-main">Neon PG</text>
    </g>
    <!-- pgvector -->
    <g class="b2" transform="translate(600, 0)" filter="url(#glowDb)">
      <rect width="115" height="40" rx="10" fill="url(#bgDb)" stroke="#6366f1" stroke-width="1.5"/>
      <text x="16" y="25" font-size="14">🗄️</text>
      <text x="34" y="25" class="t-main">pgvector</text>
    </g>
  </g>
</svg>
