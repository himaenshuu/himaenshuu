<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 70" width="100%" height="70" style="overflow: visible;">
  <defs>
    <linearGradient id="bgFrontend" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glowFrontend" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#06b6d4" flood-opacity="0.3"/>
    </filter>
  </defs>
  <style>
    .t-main { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 12px; fill: #ffffff; }
    .b1 { animation: floatY 3.2s ease-in-out infinite alternate; }
    .b2 { animation: floatY 3.7s ease-in-out infinite alternate 0.5s; }
    .b3 { animation: floatY 3.4s ease-in-out infinite alternate 1.1s; }
    .b4 { animation: floatY 4.0s ease-in-out infinite alternate 1.6s; }
    @keyframes floatY { 0% { transform: translateY(0px); } 100% { transform: translateY(-5px); } }
  </style>

  <g transform="translate(0, 10)">
    <!-- Next.js -->
    <g class="b1" transform="translate(0, 0)" filter="url(#glowFrontend)">
      <rect width="100" height="40" rx="10" fill="url(#bgFrontend)" stroke="#ffffff" stroke-width="1.5"/>
      <text x="18" y="25" font-size="14">▲</text>
      <text x="36" y="25" class="t-main">Next.js</text>
    </g>
    <!-- React -->
    <g class="b2" transform="translate(110, 0)" filter="url(#glowFrontend)">
      <rect width="95" height="40" rx="10" fill="url(#bgFrontend)" stroke="#61dafb" stroke-width="1.5"/>
      <text x="18" y="25" font-size="14">⚛️</text>
      <text x="36" y="25" class="t-main">React</text>
    </g>
    <!-- TailwindCSS -->
    <g class="b3" transform="translate(215, 0)" filter="url(#glowFrontend)">
      <rect width="125" height="40" rx="10" fill="url(#bgFrontend)" stroke="#06b6d4" stroke-width="1.5"/>
      <text x="18" y="25" font-size="14">🎨</text>
      <text x="36" y="25" class="t-main">TailwindCSS</text>
    </g>
    <!-- HTML5 -->
    <g class="b4" transform="translate(350, 0)" filter="url(#glowFrontend)">
      <rect width="95" height="40" rx="10" fill="url(#bgFrontend)" stroke="#e34f26" stroke-width="1.5"/>
      <text x="18" y="25" font-size="14">🌐</text>
      <text x="36" y="25" class="t-main">HTML5</text>
    </g>
    <!-- CSS3 -->
    <g class="b1" transform="translate(455, 0)" filter="url(#glowFrontend)">
      <rect width="90" height="40" rx="10" fill="url(#bgFrontend)" stroke="#1572b6" stroke-width="1.5"/>
      <text x="18" y="25" font-size="14">🎨</text>
      <text x="36" y="25" class="t-main">CSS3</text>
    </g>
  </g>
</svg>
