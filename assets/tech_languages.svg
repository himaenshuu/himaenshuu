<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 70" width="100%" height="70" style="overflow: visible;">
  <defs>
    <linearGradient id="bgLang" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glowLang" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#6366f1" flood-opacity="0.3"/>
    </filter>
  </defs>
  <style>
    .t-main { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 12px; fill: #ffffff; }
    .b1 { animation: floatY 3.1s ease-in-out infinite alternate; }
    .b2 { animation: floatY 3.7s ease-in-out infinite alternate 0.5s; }
    .b3 { animation: floatY 3.5s ease-in-out infinite alternate 1.1s; }
    .b4 { animation: floatY 4.1s ease-in-out infinite alternate 1.6s; }
    @keyframes floatY { 0% { transform: translateY(0px); } 100% { transform: translateY(-5px); } }
  </style>

  <g transform="translate(0, 10)">
    <!-- Python -->
    <g class="b1" transform="translate(0, 0)" filter="url(#glowLang)">
      <rect width="100" height="40" rx="10" fill="url(#bgLang)" stroke="#3776ab" stroke-width="1.5"/>
      <text x="18" y="25" font-size="14">🐍</text>
      <text x="36" y="25" class="t-main">Python</text>
    </g>
    <!-- C++ -->
    <g class="b2" transform="translate(110, 0)" filter="url(#glowLang)">
      <rect width="85" height="40" rx="10" fill="url(#bgLang)" stroke="#00599c" stroke-width="1.5"/>
      <text x="18" y="25" font-size="14">💻</text>
      <text x="36" y="25" class="t-main">C++</text>
    </g>
    <!-- TypeScript -->
    <g class="b3" transform="translate(205, 0)" filter="url(#glowLang)">
      <rect width="120" height="40" rx="10" fill="url(#bgLang)" stroke="#3178c6" stroke-width="1.5"/>
      <text x="18" y="25" font-size="14">🔷</text>
      <text x="36" y="25" class="t-main">TypeScript</text>
    </g>
    <!-- JavaScript -->
    <g class="b4" transform="translate(335, 0)" filter="url(#glowLang)">
      <rect width="115" height="40" rx="10" fill="url(#bgLang)" stroke="#f7df1e" stroke-width="1.5"/>
      <text x="18" y="25" font-size="14">🟨</text>
      <text x="36" y="25" class="t-main">JavaScript</text>
    </g>
    <!-- SQL -->
    <g class="b1" transform="translate(460, 0)" filter="url(#glowLang)">
      <rect width="85" height="40" rx="10" fill="url(#bgLang)" stroke="#4479a1" stroke-width="1.5"/>
      <text x="18" y="25" font-size="14">📊</text>
      <text x="36" y="25" class="t-main">SQL</text>
    </g>
  </g>
</svg>
