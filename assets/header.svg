<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="100%" height="230">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B51D8"/>
      <stop offset="35%" stop-color="#667EEA"/>
      <stop offset="70%" stop-color="#764BA2"/>
      <stop offset="100%" stop-color="#8A3AB9"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 62px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: rgba(255, 255, 255, 0.92);
      letter-spacing: 0.8px;
    }
    .badge {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #ffffff;
      letter-spacing: 1px;
    }
    @keyframes waveMove {
      0% { transform: translateX(0); }
      50% { transform: translateX(-30px); }
      100% { transform: translateX(0); }
    }
    .wave-anim {
      animation: waveMove 8s ease-in-out infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="900" height="230" rx="16" fill="url(#grad)"/>

  <!-- Decorative Wave 1 -->
  <path class="wave-anim" d="M0,170 C180,210 320,140 500,180 C680,220 780,150 900,175 L900,230 L0,230 Z" fill="url(#waveGrad)"/>

  <!-- Decorative Wave 2 -->
  <path d="M0,190 C150,165 350,215 520,185 C700,155 800,205 900,195 L900,230 L0,230 Z" fill="#0d1117" fill-opacity="0.95"/>

  <!-- Accent glow point -->
  <circle cx="150" cy="50" r="120" fill="#ffffff" fill-opacity="0.05" filter="blur(20px)"/>
  <circle cx="780" cy="160" r="100" fill="#00f2fe" fill-opacity="0.08" filter="blur(25px)"/>

  <!-- Main Title -->
  <g filter="url(#glow)">
    <text x="450" y="98" text-anchor="middle" class="title">Himanshu Raj</text>
  </g>

  <!-- Subtitle -->
  <g filter="url(#glow)">
    <text x="450" y="142" text-anchor="middle" class="subtitle">AI Systems &amp; Backend Engineer • RAG Architectures • Distributed Systems</text>
  </g>
</svg>
