<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 70" width="100%" height="70" style="overflow: visible;">
  <defs>
    <linearGradient id="bgDevOps" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glowDevOps" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0284c7" flood-opacity="0.3"/>
    </filter>
  </defs>
  <style>
    .t-main { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 12px; fill: #ffffff; }
    .b1 { animation: floatY 3.3s ease-in-out infinite alternate; }
    .b2 { animation: floatY 3.8s ease-in-out infinite alternate 0.5s; }
    .b3 { animation: floatY 3.5s ease-in-out infinite alternate 1.1s; }
    .b4 { animation: floatY 4.0s ease-in-out infinite alternate 1.6s; }
    @keyframes floatY { 0% { transform: translateY(0px); } 100% { transform: translateY(-5px); } }
  </style>

  <g transform="translate(0, 10)">
    <!-- Docker -->
    <g class="b1" transform="translate(0, 0)" filter="url(#glowDevOps)">
      <rect width="100" height="40" rx="10" fill="url(#bgDevOps)" stroke="#2496ed" stroke-width="1.5"/>
      <text x="18" y="25" font-size="14">🐳</text>
      <text x="36" y="25" class="t-main">Docker</text>
    </g>
    <!-- AWS -->
    <g class="b2" transform="translate(110, 0)" filter="url(#glowDevOps)">
      <rect width="85" height="40" rx="10" fill="url(#bgDevOps)" stroke="#ff9900" stroke-width="1.5"/>
      <text x="18" y="25" font-size="14">☁️</text>
      <text x="36" y="25" class="t-main">AWS</text>
    </g>
    <!-- Linux -->
    <g class="b3" transform="translate(205, 0)" filter="url(#glowDevOps)">
      <rect width="90" height="40" rx="10" fill="url(#bgDevOps)" stroke="#fcc624" stroke-width="1.5"/>
      <text x="18" y="25" font-size="14">🐧</text>
      <text x="36" y="25" class="t-main">Linux</text>
    </g>
    <!-- Git -->
    <g class="b4" transform="translate(305, 0)" filter="url(#glowDevOps)">
      <rect width="80" height="40" rx="10" fill="url(#bgDevOps)" stroke="#f05032" stroke-width="1.5"/>
      <text x="18" y="25" font-size="14">🔀</text>
      <text x="36" y="25" class="t-main">Git</text>
    </g>
    <!-- GitHub Actions -->
    <g class="b1" transform="translate(395, 0)" filter="url(#glowDevOps)">
      <rect width="145" height="40" rx="10" fill="url(#bgDevOps)" stroke="#2088ff" stroke-width="1.5"/>
      <text x="18" y="25" font-size="14">⚙️</text>
      <text x="36" y="25" class="t-main">GitHub Actions</text>
    </g>
    <!-- Vercel -->
    <g class="b2" transform="translate(550, 0)" filter="url(#glowDevOps)">
      <rect width="95" height="40" rx="10" fill="url(#bgDevOps)" stroke="#ffffff" stroke-width="1.5"/>
      <text x="18" y="25" font-size="14">▲</text>
      <text x="36" y="25" class="t-main">Vercel</text>
    </g>
  </g>
</svg>
