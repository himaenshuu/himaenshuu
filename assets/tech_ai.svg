<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 70" width="100%" height="70" style="overflow: visible;">
  <defs>
    <linearGradient id="bgAi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glowAi" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#8b5cf6" flood-opacity="0.3"/>
    </filter>
  </defs>
  <style>
    .t-main { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 12px; fill: #ffffff; }
    .b1 { animation: floatY 3.2s ease-in-out infinite alternate; }
    .b2 { animation: floatY 3.8s ease-in-out infinite alternate 0.5s; }
    .b3 { animation: floatY 3.4s ease-in-out infinite alternate 1.0s; }
    .b4 { animation: floatY 4.0s ease-in-out infinite alternate 1.5s; }
    @keyframes floatY { 0% { transform: translateY(0px); } 100% { transform: translateY(-5px); } }
  </style>

  <g transform="translate(0, 10)">
    <!-- Python -->
    <g class="b1" transform="translate(0, 0)" filter="url(#glowAi)">
      <rect width="95" height="40" rx="10" fill="url(#bgAi)" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="18" y="25" font-size="14">🐍</text>
      <text x="36" y="25" class="t-main">Python</text>
    </g>
    <!-- PyTorch -->
    <g class="b2" transform="translate(105, 0)" filter="url(#glowAi)">
      <rect width="100" height="40" rx="10" fill="url(#bgAi)" stroke="#ee4c2c" stroke-width="1.5"/>
      <text x="18" y="25" font-size="14">🔥</text>
      <text x="36" y="25" class="t-main">PyTorch</text>
    </g>
    <!-- LangChain -->
    <g class="b3" transform="translate(215, 0)" filter="url(#glowAi)">
      <rect width="115" height="40" rx="10" fill="url(#bgAi)" stroke="#10b981" stroke-width="1.5"/>
      <text x="18" y="25" font-size="14">🦜</text>
      <text x="36" y="25" class="t-main">LangChain</text>
    </g>
    <!-- OpenAI -->
    <g class="b4" transform="translate(340, 0)" filter="url(#glowAi)">
      <rect width="100" height="40" rx="10" fill="url(#bgAi)" stroke="#8b5cf6" stroke-width="1.5"/>
      <text x="18" y="25" font-size="14">🤖</text>
      <text x="36" y="25" class="t-main">OpenAI</text>
    </g>
    <!-- Gemini -->
    <g class="b1" transform="translate(450, 0)" filter="url(#glowAi)">
      <rect width="100" height="40" rx="10" fill="url(#bgAi)" stroke="#06b6d4" stroke-width="1.5"/>
      <text x="18" y="25" font-size="14">✨</text>
      <text x="36" y="25" class="t-main">Gemini</text>
    </g>
    <!-- HuggingFace -->
    <g class="b2" transform="translate(560, 0)" filter="url(#glowAi)">
      <rect width="130" height="40" rx="10" fill="url(#bgAi)" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="16" y="25" font-size="14">🤗</text>
      <text x="34" y="25" class="t-main">HuggingFace</text>
    </g>
    <!-- ChromaDB -->
    <g class="b3" transform="translate(700, 0)" filter="url(#glowAi)">
      <rect width="125" height="40" rx="10" fill="url(#bgAi)" stroke="#ec4899" stroke-width="1.5"/>
      <text x="16" y="25" font-size="14">🗄️</text>
      <text x="34" y="25" class="t-main">ChromaDB</text>
    </g>
  </g>
</svg>
