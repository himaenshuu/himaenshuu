<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 70" width="100%" height="70" style="overflow: visible;">
  <defs>
    <linearGradient id="bgBackend" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glowBackend" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#10b981" flood-opacity="0.3"/>
    </filter>
  </defs>
  <style>
    .t-main { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 12px; fill: #ffffff; }
    .b1 { animation: floatY 3.3s ease-in-out infinite alternate; }
    .b2 { animation: floatY 3.9s ease-in-out infinite alternate 0.6s; }
    .b3 { animation: floatY 3.5s ease-in-out infinite alternate 1.2s; }
    .b4 { animation: floatY 4.1s ease-in-out infinite alternate 1.7s; }
    @keyframes floatY { 0% { transform: translateY(0px); } 100% { transform: translateY(-5px); } }
  </style>

  <g transform="translate(0, 10)">
    <!-- FastAPI -->
    <g class="b1" transform="translate(0, 0)" filter="url(#glowBackend)">
      <rect width="100" height="40" rx="10" fill="url(#bgBackend)" stroke="#009688" stroke-width="1.5"/>
      <text x="18" y="25" font-size="14">⚡</text>
      <text x="36" y="25" class="t-main">FastAPI</text>
    </g>
    <!-- Node.js -->
    <g class="b2" transform="translate(110, 0)" filter="url(#glowBackend)">
      <rect width="95" height="40" rx="10" fill="url(#bgBackend)" stroke="#22c55e" stroke-width="1.5"/>
      <text x="18" y="25" font-size="14">🟢</text>
      <text x="36" y="25" class="t-main">Node.js</text>
    </g>
    <!-- Express -->
    <g class="b3" transform="translate(215, 0)" filter="url(#glowBackend)">
      <rect width="100" height="40" rx="10" fill="url(#bgBackend)" stroke="#64748b" stroke-width="1.5"/>
      <text x="18" y="25" font-size="14">🚀</text>
      <text x="36" y="25" class="t-main">Express</text>
    </g>
    <!-- Pydantic -->
    <g class="b4" transform="translate(325, 0)" filter="url(#glowBackend)">
      <rect width="105" height="40" rx="10" fill="url(#bgBackend)" stroke="#e11d48" stroke-width="1.5"/>
      <text x="18" y="25" font-size="14">🛡️</text>
      <text x="36" y="25" class="t-main">Pydantic</text>
    </g>
    <!-- REST APIs -->
    <g class="b1" transform="translate(440, 0)" filter="url(#glowBackend)">
      <rect width="110" height="40" rx="10" fill="url(#bgBackend)" stroke="#0284c7" stroke-width="1.5"/>
      <text x="18" y="25" font-size="14">🌐</text>
      <text x="36" y="25" class="t-main">REST APIs</text>
    </g>
    <!-- WebSockets -->
    <g class="b2" transform="translate(560, 0)" filter="url(#glowBackend)">
      <rect width="125" height="40" rx="10" fill="url(#bgBackend)" stroke="#a855f7" stroke-width="1.5"/>
      <text x="16" y="25" font-size="14">🔌</text>
      <text x="34" y="25" class="t-main">WebSockets</text>
    </g>
    <!-- Redis -->
    <g class="b3" transform="translate(695, 0)" filter="url(#glowBackend)">
      <rect width="90" height="40" rx="10" fill="url(#bgBackend)" stroke="#ef4444" stroke-width="1.5"/>
      <text x="16" y="25" font-size="14">⚡</text>
      <text x="34" y="25" class="t-main">Redis</text>
    </g>
  </g>
</svg>
