<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c1b"/>
      <stop offset="35%" stop-color="#1e1b4b"/>
      <stop offset="70%" stop-color="#31104b"/>
      <stop offset="100%" stop-color="#090514"/>
    </linearGradient>

    <!-- Accent Mesh Gradients -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Pill Gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.25"/>
    </linearGradient>

    <linearGradient id="pillBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.12"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="pillGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#06b6d4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 56px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 18px;
      fill: #cbd5e1;
      letter-spacing: 0.5px;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 13px;
      fill: #38bdf8;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }
    @keyframes waveMove {
      0% { transform: translateX(0); }
      50% { transform: translateX(-25px); }
      100% { transform: translateX(0); }
    }
    .wave-anim {
      animation: waveMove 9s ease-in-out infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="900" height="240" rx="16" fill="url(#bgGrad)"/>

  <!-- Glowing Orb Accents -->
  <circle cx="120" cy="40" r="100" fill="#6366f1" fill-opacity="0.18" filter="blur(30px)"/>
  <circle cx="780" cy="180" r="110" fill="#06b6d4" fill-opacity="0.18" filter="blur(35px)"/>
  <circle cx="450" cy="10" r="80" fill="#a855f7" fill-opacity="0.15" filter="blur(25px)"/>

  <!-- Geometric Grid Pattern Overlay -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="40" x2="900" y2="40"/>
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="150" y1="0" x2="150" y2="240"/>
    <line x1="300" y1="0" x2="300" y2="240"/>
    <line x1="450" y1="0" x2="450" y2="240"/>
    <line x1="600" y1="0" x2="600" y2="240"/>
    <line x1="750" y1="0" x2="750" y2="240"/>
  </g>

  <!-- Decorative Wave 1 -->
  <path class="wave-anim" d="M0,180 C180,215 340,150 520,185 C700,220 790,160 900,185 L900,240 L0,240 Z" fill="url(#waveGrad)"/>

  <!-- Decorative Wave 2 (Clean Footer Boundary) -->
  <path d="M0,205 C160,180 360,225 540,195 C720,170 810,215 900,205 L900,240 L0,240 Z" fill="#0d1117" fill-opacity="0.95"/>

  <!-- Callout Pill Badge: Ready to Build & Ship Immediately -->
  <g filter="url(#pillGlow)">
    <rect x="290" y="24" width="320" height="30" rx="15" fill="url(#pillGrad)" stroke="url(#pillBorder)" stroke-width="1.2"/>
    <text x="450" y="44" text-anchor="middle" class="pill-text">⚡ Ready to Build &amp; Ship Immediately</text>
  </g>

  <!-- Main Title -->
  <g filter="url(#textGlow)">
    <text x="450" y="118" text-anchor="middle" class="title">Himanshu Raj</text>
  </g>

  <!-- Subtitle -->
  <g filter="url(#textGlow)">
    <text x="450" y="162" text-anchor="middle" class="subtitle">AWS, Systems &amp; Backend Engineer • High-Throughput Architectures</text>
  </g>
</svg>
